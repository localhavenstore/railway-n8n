# Railway-like test stack (VM only): same variables the template sets.
services:
  pg: {image: "postgres:17-alpine", environment: {POSTGRES_USER: n8n, POSTGRES_PASSWORD: pg-test-pw-123, POSTGRES_DB: n8n}}
  redis: {image: "redis:7-alpine", command: ["redis-server", "--requirepass", "redis-test-pw-123"]}
  n8n: &n8n
    build: .
    image: n8n-tpl
    environment: &env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: pg
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: pg-test-pw-123
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: redis-test-pw-123
      N8N_ENCRYPTION_KEY: enc-test-key-0123456789abcdef0123456789
      N8N_DEFAULT_BINARY_DATA_MODE: database
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PORT: "5678"
      N8N_OWNER_EMAIL: owner@example.test
      N8N_OWNER_PASSWORD: owner-test-pw-1234
      RAILWAY_PUBLIC_DOMAIN: n8n-test.example.test
    ports: ["127.0.0.1:5678:5678"]
    volumes: ["n8ndata:/home/node/.n8n"]
    depends_on: [pg, redis]
  worker:
    image: n8n-tpl
    command: ["worker"]
    environment: *env
    depends_on: [n8n]
volumes: {n8ndata: {}}
